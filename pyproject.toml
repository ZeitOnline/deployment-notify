[project]
name = "zeit.deploynotify"
authors = [{ name = "Zeit Online", email = "zon-backend@zeit.de" }]
dynamic = ["readme", "version"]
dependencies = [
    "click",
    "jira",
    "requests",
]

[dependency-groups]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/ZeitOnline/deployment-notify"
Changelog = "https://github.com/ZeitOnline/deployment-notify/blob/main/CHANGES.md"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = ["/bin"]
[tool.hatch.build.targets.wheel]
packages = ["src/zeit"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{path="README.md"}, {text="\n\n"}, {path="CHANGES.md"}]

[tool.pytest.ini_options]
addopts = "--tb=native"
filterwarnings = [
  "error",
  # https://github.com/pycontribs/jira/issues/1557
  "ignore::DeprecationWarning:jira.client",
]
pythonpath = [
  "src",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
from-first = true
lines-after-imports = 2
